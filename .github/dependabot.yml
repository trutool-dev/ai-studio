version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/projects/healthy/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "security"
      - "dependencies"
    ignore:
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/projects/healthy/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "security"
      - "dependencies"
    open-pull-requests-limit: 5
