name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthy_test
          POSTGRES_PASSWORD: healthy_test
          POSTGRES_DB: healthy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: projects/healthy/backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-not-used-in-production-min-64-chars-padding
      JWT_REFRESH_SECRET: test-refresh-secret-not-used-in-production-padding

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate --schema=../database/schema.prisma

      - name: Lint
        run: npm run lint --if-present

      - name: Tests con cobertura
        run: |
          npx jest \
            --coverage \
            --forceExit \
            --passWithNoTests

      - name: Subir informe de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: projects/healthy/backend/coverage/
          retention-days: 7

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build backend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen backend (sin push)
        uses: docker/build-push-action@v5
        with:
          context: ./projects/healthy/backend
          file: ./projects/healthy/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── AI module ────────────────────────────────────────────────────────────────
  ai:
    name: AI — lint + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/healthy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test -- --passWithNoTests
