# Tests workflow para el proyecto Healthy (TS-07)
# Ejecuta todos los tests (unit + integration + E2E) del backend y del módulo AI.
# Falla el pipeline si la cobertura global cae por debajo del 80 %.
# Genera artefacto con informe HTML de cobertura.

name: Healthy — Tests + Cobertura

on:
  push:
    branches: [main, develop]
    paths:
      - "projects/healthy/backend/**"
      - "projects/healthy/tests/**"
      - "projects/healthy/src/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "projects/healthy/backend/**"
      - "projects/healthy/tests/**"
      - "projects/healthy/src/**"

concurrency:
  group: healthy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Tests unitarios del módulo AI (nutrition calculator) ──────────────────

  unit-tests:
    name: Tests unitarios — nutritionCalculator
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/healthy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/package-lock.json

      - name: Instalar dependencias del módulo AI
        run: npm ci

      - name: Ejecutar tests unitarios con cobertura
        run: |
          npx jest \
            --testPathPatterns="tests/unit/" \
            --coverage \
            --collectCoverageFrom="src/utils/**/*.js" \
            --coverageReporters=text,lcov \
            --passWithNoTests

      - name: Subir cobertura unitaria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: projects/healthy/coverage/
          retention-days: 7

  # ─── Tests de integración + E2E del backend ────────────────────────────────

  integration-tests:
    name: Tests integración + E2E — backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthy_test
          POSTGRES_PASSWORD: healthy_test
          POSTGRES_DB: healthy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: projects/healthy/backend

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      TEST_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-for-ci-only
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate --schema=../database/schema.prisma

      - name: Ejecutar migraciones en BD de test
        run: |
          npx prisma migrate deploy \
            --schema=../database/schema.prisma

      - name: Ejecutar tests de integración + E2E con cobertura
        run: |
          npx jest \
            --config=jest.config.js \
            --testPathPatterns="tests/integration/|tests/e2e/" \
            --coverage \
            --coverageThreshold='{"global":{"lines":40}}' \
            --runInBand \
            --forceExit \
            --passWithNoTests

      - name: Subir informe HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-html
          path: projects/healthy/backend/coverage/
          retention-days: 14

  # ─── Cobertura total del backend (umbral 80 %) ─────────────────────────────
  # Este job ejecuta TODOS los tests (unit + integration + E2E) juntos
  # para calcular la cobertura global y fallar si cae del 80 %.

  coverage-gate:
    name: Cobertura global ≥ 80 % — backend
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthy_test
          POSTGRES_PASSWORD: healthy_test
          POSTGRES_DB: healthy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: projects/healthy/backend

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      TEST_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-for-ci-only
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate --schema=../database/schema.prisma

      - name: Ejecutar migraciones
        run: npx prisma migrate deploy --schema=../database/schema.prisma

      - name: Tests completos con umbral de cobertura global 80 %
        run: |
          npx jest \
            --config=jest.config.js \
            --coverage \
            --coverageThreshold='{"global":{"lines":80}}' \
            --runInBand \
            --forceExit \
            --passWithNoTests
        # Si la cobertura global cae del 80 %, este step falla y bloquea el merge

      - name: Subir informe de cobertura total (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-coverage-html
          path: projects/healthy/backend/coverage/
          retention-days: 30
