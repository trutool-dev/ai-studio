name: Deploy

on:
  push:
    branches:
      - main      # → producción
      - develop   # → staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Service IDs de Railway (no son secretos, son identificadores públicos del servicio)
  RAILWAY_STAGING_SERVICE_ID: fa137c98-5210-4057-a531-f1c7fbf39743    # backend (staging)
  # Producción se obtiene de RAILWAY_PRODUCTION_SERVICE_ID (repo secret)

jobs:
  # ── Deploy a staging (develop → staging) ────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging (Railway)
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend a Railway staging
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: a01d9f3d-510b-4529-b75a-d9d7198cbcb5
          RAILWAY_ENVIRONMENT_ID: 1bc84954-5618-44fd-98fc-5b4190523cf0
        run: railway up --service ${{ env.RAILWAY_STAGING_SERVICE_ID }} --detach

      - name: Smoke test staging
        run: |
          echo "Verificando que la API de staging responde..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://backend-staging-01ee.up.railway.app/health \
              --max-time 10 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: /health respondio HTTP 200"
              exit 0
            fi
            echo "Intento $i: HTTP $STATUS — reintentando en 5s..."
            sleep 5
          done
          echo "ERROR: /health no respondio 200 tras 60s"
          exit 1

  # ── Deploy a producción (main → production) ──────────────────────────────────
  deploy-production:
    name: Deploy → Production (Railway)
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    environment: production  # requiere aprobación manual en GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend a Railway production
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: a01d9f3d-510b-4529-b75a-d9d7198cbcb5
          RAILWAY_ENVIRONMENT_ID: 3cb3489e-beda-44bf-9396-bf2618b121f3
        run: railway up --service ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }} --detach

      - name: Smoke test production
        run: |
          echo "Verificando que la API de producción responde..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://ai-studio-production-1835.up.railway.app/health \
              --max-time 10 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: /health respondio HTTP 200"
              exit 0
            fi
            echo "Intento $i: HTTP $STATUS — reintentando en 5s..."
            sleep 5
          done
          echo "ERROR: /health no respondio 200 tras 60s"
          exit 1
