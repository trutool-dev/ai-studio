name: Secret Scan

# SEC-42 (SA-11 + JB-20): escaneo de secretos con gitleaks en CI.
# - gitleaks-diff (bloqueante): analiza solo los commits nuevos del PR / push.
# - gitleaks-tree (informativo): analiza el árbol completo actual. Está en
#   continue-on-error hasta cerrar SEC-25/SEC-26 y SA-09 (.claude/settings.local.json
#   versionado); después hay que quitar continue-on-error para que bloquee.
# Hallazgos históricos ya conocidos (no rompen el CI):
# - El historial git anterior contiene secretos ya expuestos (SEC-25/SEC-26).
#   gitleaks-diff solo mira los commits nuevos, así que no los vuelve a reportar.
#   Se tratan ROTÁNDOLOS (ver projects/healthy/backend/SECRETS_POLICY.md).
# - Si hiciera falta aceptar un hallazgo concreto (falso positivo verificado),
#   se añade su fingerprint a `.gitleaksignore` (baseline) o se marca la línea
#   con `gitleaks:allow`; nunca se amplía la allowlist de .gitleaks.toml para
#   ocultar un secreto real.
# Recomendado además (manual, Antonio): GitHub → Settings → Code security →
# Secret scanning + Push protection.

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Cada lunes a las 7h UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versión fijada de gitleaks; el binario se verifica contra el checksum publicado
  GITLEAKS_VERSION: '8.21.2'

jobs:
  gitleaks-diff:
    name: gitleaks (commits nuevos)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Descargar fuera del checkout para no escanear el propio binario
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 ${PUSH_AFTER}"
          else
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "Scanning range: $range"
          # --redact: nunca imprimir el valor del secreto en los logs de CI
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="$range" .

  gitleaks-tree:
    name: gitleaks (árbol completo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .
