name: Deploy to Staging (Railway)

on:
  push:
    branches:
      - develop
    paths:
      - "projects/healthy/backend/**"

env:
  RAILWAY_SERVICE_ID: fa137c98-5210-4057-a531-f1c7fbf39743  # backend (staging)

jobs:
  # ── 1. Tests con cobertura ──────────────────────────────────────────────────
  test:
    name: Tests + cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthy_test
          POSTGRES_PASSWORD: healthy_test
          POSTGRES_DB: healthy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://healthy_test:healthy_test@localhost:5432/healthy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-not-used-in-production-min-64-chars-padding
      JWT_REFRESH_SECRET: test-refresh-secret-not-used-in-production-padding

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/healthy/backend/package-lock.json

      - name: Instalar dependencias
        working-directory: projects/healthy/backend
        run: npm ci

      - name: Tests con cobertura (mínimo 80%)
        working-directory: projects/healthy/backend
        run: |
          npx jest \
            --coverage \
            --coverageThreshold='{"global":{"lines":80}}' \
            --forceExit \
            --passWithNoTests

      - name: Subir informe de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: projects/healthy/backend/coverage/
          retention-days: 7

  # ── 2. Deploy a Railway staging ─────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: a01d9f3d-510b-4529-b75a-d9d7198cbcb5
      RAILWAY_ENVIRONMENT_ID: 1bc84954-5618-44fd-98fc-5b4190523cf0

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        run: railway up --service ${{ env.RAILWAY_SERVICE_ID }} --detach

  # ── 3. Smoke test ───────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Esperar y verificar /health
        run: |
          echo "Verificando que la API de staging responde..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://backend-staging-01ee.up.railway.app/health \
              --max-time 10 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: /health devolvio HTTP 200 en el intento $i"
              break
            fi
            echo "Intento $i: HTTP $STATUS — reintentando en 5s..."
            sleep 5
            if [ $i -eq 12 ]; then
              echo "ERROR: /health no respondio 200 tras 60s"
              exit 1
            fi
          done

      - name: Verificar respuesta del health check
        run: |
          RESPONSE=$(curl -s \
            https://backend-staging-01ee.up.railway.app/health \
            --max-time 10)
          echo "Health check: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('success') == True, f'success no es true: {d}'
          print('Smoke test OK')
          "
