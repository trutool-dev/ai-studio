name: Deploy Landing

on:
  push:
    branches:
      - main
    paths:
      - "projects/healthy/landing/**"

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Sync S3 + Invalidate CloudFront
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # index.html sin caché para que el navegador siempre sirva la versión más nueva
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp projects/healthy/landing/index.html \
            s3://healthy-landing-prod/index.html \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"

      # Resto de assets con caché de 24 h; --delete elimina archivos huérfanos
      - name: Sync static assets
        run: |
          aws s3 sync projects/healthy/landing/ s3://healthy-landing-prod \
            --delete \
            --cache-control "public,max-age=86400" \
            --exclude "index.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
