name: EAS Build (preview)

on:
  push:
    branches:
      - develop
    paths:
      - "projects/healthy/frontend/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma a compilar"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: "Perfil de build"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build app with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/healthy/frontend/package-lock.json

      - name: Install dependencies
        working-directory: projects/healthy/frontend
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS
        working-directory: projects/healthy/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"

          echo "Compilando plataforma: $PLATFORM, perfil: $PROFILE"

          eas build \
            --platform $PLATFORM \
            --profile $PROFILE \
            --non-interactive \
            --no-wait

          echo "Build enviado a EAS. Ver estado en: https://expo.dev/accounts/healthy/projects/healthy/builds"
